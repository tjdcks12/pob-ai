<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#282830">
  <title>PoB AI</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="agent-dock">
  <header class="agent-header">
    <div class="agent-brand"><img src="icon.svg?v=poe2way" alt="" width="20" height="20"><h1>PoB AI</h1></div>
    <button id="pob-status" class="status-pill" type="button"><span class="dot"></span><span class="label"></span></button>
    <div class="agent-header-actions">
      <button id="open-history" class="agent-icon" type="button" data-title="history"><svg class="p-icon"><use href="icons.svg#i-history"/></svg></button>
    </div>
    <div class="window-controls" hidden>
      <button id="window-minimize" class="window-control" type="button" data-title="minimize"><svg class="p-icon"><use href="icons.svg#i-window-minimize"/></svg></button>
      <button id="window-maximize" class="window-control" type="button" data-title="maximize"><svg class="p-icon"><use href="icons.svg#i-window-maximize"/></svg></button>
      <button id="window-close" class="window-control window-close" type="button" data-title="close"><svg class="p-icon"><use href="icons.svg#i-x"/></svg></button>
    </div>
  </header>

  <div id="update-banner" class="banner" hidden><span id="update-text"></span><button id="update-now" type="button" class="agent-primary" data-i18n="updateNow"></button></div>
  <div id="connection-banner" class="connection-banner" role="status" hidden><span data-i18n="connectionLost"></span><button id="reconnect" type="button" data-i18n="reconnect"></button></div>

  <div class="agent-sessions">
    <nav id="sessions" class="agent-session-list" role="tablist"></nav>
    <button id="new-chat" class="agent-icon agent-session-add" type="button" data-title="newChat" aria-haspopup="dialog" aria-controls="picker-popover" aria-expanded="false"><svg class="p-icon"><use href="icons.svg#i-plus"/></svg></button>
  </div>

  <main id="chat" class="agent-chat-messages" aria-live="polite">
    <section id="pob-setup" class="pob-setup" aria-labelledby="pob-setup-heading" hidden>
      <h2 id="pob-setup-heading" data-i18n="pobSetup"></h2>
      <p data-i18n="pobNotFound"></p>
      <div class="pob-setup-actions">
        <button id="setup-install-pob" class="agent-primary" type="button" data-i18n="installPob"></button>
        <button id="setup-existing-pob" type="button" data-i18n="connectExistingPob"></button>
      </div>
      <p id="pob-setup-status" role="status" hidden></p>
    </section>
    <div id="empty" class="empty">
      <div id="picker-inline"></div>
      <h2 data-i18n="emptyTitle"></h2>
      <div class="suggestions">
        <button type="button" data-suggest="s1"></button>
        <button type="button" data-suggest="s2"></button>
        <button type="button" data-suggest="s3"></button>
        <button type="button" data-suggest="s4"></button>
        <button type="button" data-suggest="s5"></button>
        <button type="button" data-suggest="s6"></button>
      </div>
    </div>
  </main>

  <div id="popover-backdrop" class="popover-backdrop" aria-hidden="true" hidden></div>
  <div id="picker-popover" class="agent-picker-popover" role="dialog" aria-modal="true" data-label="newChat" hidden></div>
  <div id="model-popover" class="model-popover" role="dialog" aria-modal="true" data-label="model" hidden></div>

  <form id="composer" class="agent-compose">
    <div id="attachments" class="attachments" hidden></div>
    <textarea id="input" rows="2" data-placeholder="placeholder" data-title="sendHint" data-label="placeholder"></textarea>
    <div class="agent-compose-actions">
      <button id="attach" class="agent-icon" type="button" data-title="attachImage"><svg class="p-icon"><use href="icons.svg#i-paperclip"/></svg></button>
      <button id="model-button" class="model-button" type="button" aria-haspopup="dialog" aria-expanded="false"><svg class="p-icon"><use href="icons.svg#i-sliders-horizontal"/></svg><span id="model-label"></span></button>
      <span class="spacer"></span>
      <button id="send" class="agent-send agent-primary" type="submit" data-title="send"><svg class="p-icon"><use href="icons.svg#i-arrow-up"/></svg></button>
    </div>
    <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </form>

  <template id="settings-template">
  <dialog id="settings-dialog" class="p-dialog" aria-labelledby="settings-heading">
    <div class="p-dialog-head">
      <span class="p-dialog-icon"><svg class="p-icon"><use href="icons.svg#i-settings"/></svg></span>
      <h2 id="settings-heading" data-i18n="settings"></h2>
      <button class="agent-icon" type="button" data-close data-title="close"><svg class="p-icon"><use href="icons.svg#i-x"/></svg></button>
    </div>
    <div class="p-dialog-body">
      <section class="set-section">
        <h3 class="set-head" data-i18n="sectionPanel"></h3>
        <div class="set-row"><label class="set-title" for="locale" data-i18n="language"></label><div class="set-control"><select id="locale"></select></div></div>
        <div class="set-row theme-row"><div id="theme-label" class="set-title" data-i18n="theme"></div><div id="theme-cards" class="theme-grid" role="radiogroup" aria-labelledby="theme-label"></div></div>
      </section>
      <section class="set-section">
        <h3 class="set-head" data-i18n="sectionPobWindow"></h3>
        <div class="set-row stacked">
          <label class="set-title" for="pob-path" data-i18n="pobFolder"></label>
          <div class="field-row"><input id="pob-path" type="text" spellcheck="false" autocomplete="off"><button id="pob-path-apply" type="button" data-i18n="apply"></button></div>
          <p id="pob-path-status" class="set-desc" data-i18n="pobFolderDesc" role="status"></p>
          <div class="set-actions"><button id="pob-install" type="button" class="agent-quiet"><svg class="p-icon"><use href="icons.svg#i-folder-open"/></svg><span data-i18n="installPob"></span></button></div>
        </div>
      </section>
      <section class="set-section">
        <h3 class="set-head" data-i18n="sectionAgents"></h3>
        <div id="agent-rows"></div>
      </section>
      <footer class="settings-footer">
        <a class="poe2way-link" data-poe2way href="https://www.poe2way.com/" target="_blank" rel="noopener noreferrer" data-title="visitWebsite">
          <img src="icon.svg?v=poe2way" alt="" width="20" height="20"><span>poe2way</span><svg class="p-icon" aria-hidden="true"><use href="icons.svg#i-external-link"/></svg>
        </a>
      </footer>
    </div>
  </dialog>
  </template>

  <dialog id="history-dialog" class="p-dialog" aria-labelledby="history-heading">
    <div class="p-dialog-head">
      <span class="p-dialog-icon"><svg class="p-icon"><use href="icons.svg#i-history"/></svg></span>
      <h2 id="history-heading" data-i18n="history"></h2>
      <button class="agent-icon" type="button" data-close data-title="close"><svg class="p-icon"><use href="icons.svg#i-x"/></svg></button>
    </div>
    <div class="p-dialog-body"><ul id="history-list" class="history-list"></ul></div>
  </dialog>

  <dialog id="diagnostics-dialog" class="p-dialog" aria-labelledby="diagnostics-heading">
    <div class="p-dialog-head">
      <h2 id="diagnostics-heading" data-i18n="diagnostics"></h2>
      <button class="agent-icon" type="button" data-close data-title="close"><svg class="p-icon"><use href="icons.svg#i-x"/></svg></button>
    </div>
    <div class="p-dialog-body">
      <p id="diagnostics-reason"></p>
      <p id="diagnostics-note" class="set-desc" data-i18n="diagnosticNote"></p>
      <pre id="diagnostics-report" tabindex="0"></pre>
      <button id="copy-diagnostics" type="button" data-i18n="copyDiagnostics"></button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
