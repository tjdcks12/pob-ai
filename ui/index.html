<!doctype html>
<html lang="en" data-theme="ember">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoB AI</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><span>PoB AI</span></div>
    <button id="pob-status" class="pill" type="button"><span class="dot"></span><span class="label"></span></button>
    <div class="spacer"></div>
    <button id="new-chat" class="icon-btn" type="button" data-title="newChat">＋</button>
    <button id="toggle-history" class="icon-btn" type="button" data-title="history">☰</button>
    <button id="toggle-settings" class="icon-btn" type="button" aria-label="Settings">⚙</button>
  </header>

  <section id="settings" class="drawer" hidden>
    <label><span data-i18n="agent"></span><select id="provider"></select></label>
    <label><span data-i18n="language"></span><select id="locale"></select></label>
    <label><span data-i18n="theme"></span><select id="theme">
      <option value="ember">Ember</option><option value="vaal">Vaal</option><option value="midnight">Midnight</option><option value="parchment">Parchment</option>
    </select></label>
  </section>

  <section id="history" class="drawer" hidden><ul id="history-list"></ul></section>

  <section id="build-card" class="build-card">
    <div class="build-head"><strong id="build-name"></strong><span id="build-sub"></span></div>
    <dl id="build-stats" class="stats"></dl>
  </section>

  <main id="chat" class="chat" aria-live="polite">
    <div id="empty" class="empty">
      <h1 data-i18n="emptyTitle"></h1>
      <div class="suggestions">
        <button type="button" data-suggest="s1"></button>
        <button type="button" data-suggest="s2"></button>
        <button type="button" data-suggest="s3"></button>
        <button type="button" data-suggest="s4"></button>
      </div>
    </div>
  </main>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" data-placeholder="placeholder"></textarea>
    <button id="send" type="submit" class="primary" data-i18n="send"></button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
