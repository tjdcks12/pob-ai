# Builds the Windows release when a version tag is pushed (v1.2.3) and attaches the zip and
# latest.json to the GitHub release; `pob update` in earlier versions reads latest.json from
# releases/latest/download/.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Official Node.js build to bundle (node.exe and its LICENSE)
        shell: pwsh
        run: |
          $version = node -p "process.version"
          Invoke-WebRequest "https://nodejs.org/dist/$version/node-$version-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node
          "NODE_DIR=$((Resolve-Path "node/node-$version-win-x64").Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package
        shell: pwsh
        run: |
          if ("v$(node -p "require('./package.json').version")" -ne "${{ github.ref_name }}") { throw 'The tag does not match the version in package.json' }
          node scripts/package.mjs --node-dir "$env:NODE_DIR" --update-url "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/latest.json --title "PoB AI ${{ github.ref_name }}" --generate-notes
