# Runs the tests against the latest Path of Building (PoE2) release, on every push and daily,
# so a PoB update that breaks the adapter is noticed before users report it.
name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download the latest PoB (PoE2) portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/PathOfBuildingCommunity/PathOfBuilding-PoE2/releases/latest | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -match 'portable.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No portable zip in $($release.tag_name)" }
          Invoke-WebRequest $asset.browser_download_url -OutFile pob.zip
          Expand-Archive pob.zip -DestinationPath pob
          $exe = Get-ChildItem pob -Recurse -Filter 'Path of Building-PoE2.exe' | Select-Object -First 1
          "POB_PATH=$($exe.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PoB $($release.tag_name) at $($exe.DirectoryName)"
      - run: npm test
